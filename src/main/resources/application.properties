spring.application.name=bloodlinkd
server.port=8080

# ---- Database (default: H2 file database, no installation needed) ----
spring.datasource.url=jdbc:h2:file:./data/bloodlink;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To use MySQL instead: comment the H2 block above and uncomment this ----
# (create the schema first:  CREATE DATABASE bloodlink;)
#spring.datasource.url=jdbc:mysql://localhost:3306/bloodlink?useSSL=false&serverTimezone=Asia/Kolkata
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Business rules ----
bloodlink.donation-gap-days=90
bloodlink.min-donor-age=18
bloodlink.max-donor-age=65
